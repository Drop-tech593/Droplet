<!doctype html><html><head><meta charset="utf-8"><title>Droplet layout QA</title><style>body{font:15px system-ui;margin:20px;background:#f1f5f9;color:#0f172a}button,select{padding:10px;margin:4px;border:1px solid #cbd5e1;border-radius:8px;background:white}#frame-wrap{max-width:100%;overflow:auto;background:white}iframe{display:block;border:1px solid #94a3b8}pre{white-space:pre-wrap;max-height:220px;overflow:auto}</style></head><body><h1>Droplet page layouts</h1><label>Page <select id="page"></select></label><label>Width <select id="width"><option>390</option><option>1280</option></select></label><button id="open">Open page</button><button id="run">Check all pages at this width</button><button id="save">Download results</button><p id="status">Choose a page or run the checks.</p><pre id="results"></pre><div id="frame-wrap"><iframe id="preview" width="390" height="844" title="Droplet preview"></iframe></div><script>
const routes=["/about", "/add-page-numbers", "/add-watermark", "/ai-summarizer", "/avif-to-png", "/contact", "/crop-pdf", "/csv-to-json", "/edit-pdf", "/eps-to-svg", "/epub-to-pdf", "/excel-to-pdf", "/extract-pages", "/faq", "/gif-to-png", "/heic-to-jpg", "/html-to-pdf", "/", "/jpg-to-pdf", "/json-to-csv", "/merge-pdf", "/offline", "/organize-pdf", "/pdf-forms", "/pdf-to-excel", "/pdf-to-jpg", "/pdf-to-markdown", "/pdf-to-pdfa", "/pdf-to-powerpoint", "/pdf-to-txt", "/pdf-to-word", "/powerpoint-to-pdf", "/privacy", "/psd-to-png", "/raw-to-jpg", "/remove-pages", "/rotate-pdf", "/scan-to-pdf", "/split-pdf", "/svg-to-png", "/terms", "/tiff-to-pdf", "/translate-pdf", "/txt-to-pdf", "/voice-to-text", "/webp-to-jpg", "/webp-to-png", "/word-to-pdf", "/xml-to-json"];const frame=document.getElementById('preview'),page=document.getElementById('page'),width=document.getElementById('width'),status=document.getElementById('status'),results=document.getElementById('results');let records=[];
for(const route of routes){const option=document.createElement('option');option.value=route;option.textContent=route;page.append(option);}
async function open(route){frame.width=width.value;return new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(new Error('Page load timed out: '+route)),15000);frame.onload=()=>{clearTimeout(timer);frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(()=>resolve()));};frame.src=route;});}
function inspect(route){const doc=frame.contentDocument,win=frame.contentWindow,header=doc.querySelector('.site-header'),h=header?.getBoundingClientRect();return{route,width:win.innerWidth,overflow:Math.max(0,doc.documentElement.scrollWidth-win.innerWidth),headerTop:Math.round(h?.top||0),headerHeight:Math.round(h?.height||0),headings:doc.querySelectorAll('h1').length,ads:doc.querySelectorAll('script[src*="googlesyndication"],ins.adsbygoogle').length,background:win.getComputedStyle(doc.body).backgroundColor,dark:doc.documentElement.classList.contains('dark')};}
document.getElementById('open').onclick=async()=>{await open(page.value);status.textContent='Showing '+page.value;};document.getElementById('run').onclick=async()=>{records=[];for(const route of routes){page.value=route;status.textContent='Checking '+route;try{await open(route);records.push(inspect(route));}catch(error){records.push({route,error:error.message});}results.textContent=JSON.stringify(records,null,2);}status.textContent='Finished '+records.length+' pages.';};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='layout-'+width.value+'.json';a.click();};open('/edit-pdf');
</script></body></html>
