<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Voice to Text v1 - Droplet</title>
</head>

<body>

    <h1>Voice to Text v1</h1>

    <p>
        Local AI transcription powered by your device.
    </p>


    <!-- ==========================================
         DEVICE TEST
    =========================================== -->

    <h2>1. Device</h2>

    <button id="device-test">
        Check My Device
    </button>

    <pre id="device-results">Click "Check My Device"</pre>


    <!-- ==========================================
         AUDIO FILE
    =========================================== -->

    <h2>2. Select Audio</h2>

    <input
        type="file"
        id="audio-file"
        accept="audio/*"
    >


    <!-- ==========================================
         TRANSCRIPTION
    =========================================== -->

    <h2>3. Transcribe</h2>

    <button id="transcribe-button">
        Transcribe Audio
    </button>


    <p id="status">
        Waiting for audio...
    </p>


    <!-- ==========================================
         TRANSCRIPT
    =========================================== -->

    <h2>Transcript</h2>

    <textarea
        id="transcript"
        rows="15"
        cols="80"
        placeholder="Your transcript will appear here..."
    ></textarea>


    <!-- ==========================================
         DROPLET VOICE ENGINE
    =========================================== -->

    <script src="./voice-engine/js/device-check.js"></script>

    <script src="./voice-engine/js/model-manager.js"></script>

    <script src="./voice-engine/js/audio-processor.js"></script>


    <!-- ==========================================
         TRANSFORMERS.JS + WHISPER
    =========================================== -->

    <script type="module">

        import {
            pipeline
        } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


        // ==========================================
        // UI ELEMENTS
        // ==========================================

        const deviceButton =
            document.getElementById("device-test");

        const deviceResults =
            document.getElementById("device-results");

        const audioInput =
            document.getElementById("audio-file");

        const transcribeButton =
            document.getElementById("transcribe-button");

        const status =
            document.getElementById("status");

        const transcript =
            document.getElementById("transcript");


        // Whisper pipeline will be stored here
        // after the first model load.

        let transcriber = null;


        // ==========================================
        // DEVICE TEST
        // ==========================================

        deviceButton.addEventListener(
            "click",
            async () => {

                try {

                    const capabilities =
                        await window.DropletVoice
                            .detectCapabilities();


                    deviceResults.textContent =
                        JSON.stringify(
                            capabilities,
                            null,
                            2
                        );


                } catch (error) {

                    console.error(
                        "Device detection error:",
                        error
                    );


                    deviceResults.textContent =
                        "Device test failed: " +
                        error.message;
                }

            }
        );


        // ==========================================
        // TRANSCRIBE BUTTON
        // ==========================================

        transcribeButton.addEventListener(
            "click",
            async () => {

                const file =
                    audioInput.files[0];


                // ----------------------------------
                // CHECK AUDIO FILE
                // ----------------------------------

                if (!file) {

                    alert(
                        "Please select an audio file first."
                    );

                    return;
                }


                // Prevent double clicking while
                // transcription is running.

                transcribeButton.disabled = true;


                try {

                    transcript.value = "";


                    console.log(
                        "================================"
                    );

                    console.log(
                        "Droplet Voice-to-Text v1 starting"
                    );

                    console.log(
                        "File:",
                        file.name
                    );

                    console.log(
                        "File type:",
                        file.type
                    );

                    console.log(
                        "File size:",
                        file.size,
                        "bytes"
                    );


                    // ==================================
                    // STEP 1
                    // CHECK DEVICE
                    // ==================================

                    status.textContent =
                        "Checking device...";


                    const configuration =
                        await window.DropletVoice
                            .selectModel();


                    console.log(
                        "Voice configuration:",
                        configuration
                    );


                    // ==================================
                    // STEP 2
                    // LOAD WHISPER
                    // ==================================

                    if (!transcriber) {

                        status.textContent =
                            "Loading Whisper AI model...";


                        console.log(
                            "Loading Whisper Base English..."
                        );


                        transcriber =
                            await pipeline(

                                "automatic-speech-recognition",

                                "onnx-community/whisper-base.en",

                                {
                                    device: "webgpu"
                                }

                            );


                        console.log(
                            "Whisper model loaded."
                        );


                        status.textContent =
                            "Whisper loaded.";
                    }


                    // ==================================
                    // STEP 3
                    // DECODE AUDIO
                    // ==================================

                    status.textContent =
                        "Decoding and preparing audio...";


                    console.log(
                        "Starting audio preprocessing..."
                    );


                    const audioData =
                        await window.DropletVoice
                            .processAudioFile(file);


                    console.log(
                        "Audio ready for Whisper:",
                        audioData.length,
                        "samples"
                    );


                    console.log(
                        "Calculated duration:",
                        audioData.length / 16000,
                        "seconds"
                    );


                    // ==================================
                    // AUDIO VALIDATION
                    // ==================================

                    if (
                        !audioData ||
                        audioData.length === 0
                    ) {

                        throw new Error(
                            "Audio processor returned empty audio."
                        );
                    }


                    // Find audio amplitude.
                    // This helps us detect completely
                    // silent/invalid decoded audio.

                    let maxAmplitude = 0;

                    let sumAmplitude = 0;


                    for (
                        let i = 0;
                        i < audioData.length;
                        i++
                    ) {

                        const amplitude =
                            Math.abs(
                                audioData[i]
                            );


                        if (
                            amplitude >
                            maxAmplitude
                        ) {

                            maxAmplitude =
                                amplitude;
                        }


                        sumAmplitude +=
                            amplitude;
                    }


                    const averageAmplitude =
                        sumAmplitude /
                        audioData.length;


                    console.log(
                        "Maximum audio amplitude:",
                        maxAmplitude
                    );


                    console.log(
                        "Average audio amplitude:",
                        averageAmplitude
                    );


                    if (
                        maxAmplitude <
                        0.00001
                    ) {

                        throw new Error(
                            "Decoded audio appears to be silent."
                        );
                    }


                    // ==================================
                    // STEP 4
                    // WHISPER TRANSCRIPTION
                    // ==================================

                    status.textContent =
                        "Transcribing audio with Whisper...";


                    console.log(
                        "Sending audio to Whisper..."
                    );


                    const startTime =
                        performance.now();


                    const result =
                        await transcriber(
                            audioData,
                            {
                                chunk_length_s: 20,
                                stride_length_s: 3
                            }
                        );


                    const endTime =
                        performance.now();


                    const transcriptionSeconds =
                        (
                            (endTime - startTime) /
                            1000
                        ).toFixed(2);


                    console.log(
                        "Whisper finished in:",
                        transcriptionSeconds,
                        "seconds"
                    );


                    // ==================================
                    // STEP 5
                    // INSPECT WHISPER RESULT
                    // ==================================

                    console.log(
                        "Droplet transcript:",
                        result
                    );


                    console.log(
                        "Result type:",
                        typeof result
                    );


                    console.log(
                        "Full result:",
                        JSON.stringify(
                            result,
                            null,
                            2
                        )
                    );


                    // ==================================
                    // STEP 6
                    // DISPLAY TRANSCRIPT
                    // ==================================

                    if (
                        result &&
                        typeof result.text === "string" &&
                        result.text.trim().length > 0
                    ) {

                        transcript.value =
                            result.text.trim();


                        status.textContent =
                            "Transcription complete.";


                        console.log(
                            "Transcript successfully generated."
                        );

                    } else {

                        transcript.value =
                            "Whisper returned no text.";


                        status.textContent =
                            "Transcription finished, but no speech was detected.";


                        console.warn(
                            "Whisper returned an empty transcript."
                        );

                    }


                    console.log(
                        "================================"
                    );


                } catch (error) {

                    // ==================================
                    // ERROR HANDLING
                    // ==================================

                    console.error(
                        "Droplet transcription error:",
                        error
                    );


                    status.textContent =
                        "Transcription failed: " +
                        error.message;


                    transcript.value =
                        "ERROR:\n\n" +
                        error.message;

                } finally {

                    // Re-enable button

                    transcribeButton.disabled =
                        false;
                }

            }
        );

    </script>

</body>
</html>
