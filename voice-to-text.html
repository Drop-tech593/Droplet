<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Voice to Text V2 - Droplet</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
        }


        button,
        select,
        input {
            font-size: 16px;
            padding: 10px;
            margin: 5px 0;
        }


        button {
            cursor: pointer;
        }


        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }


        textarea {
            width: 100%;
            min-height: 300px;
            box-sizing: border-box;
            font-size: 16px;
            padding: 15px;
        }


        #status {
            font-weight: bold;
        }


        #progress-container {
            width: 100%;
            height: 20px;
            background: #ddd;
            margin-top: 15px;
            overflow: hidden;
        }


        #progress-bar {
            width: 0%;
            height: 100%;
            background: #333;
            transition: width 0.2s;
        }


        #debug {
            background: #111;
            color: #eee;
            padding: 15px;
            white-space: pre-wrap;
            overflow: auto;
            max-height: 300px;
        }

    </style>

</head>


<body>


    <h1>
        Voice to Text V2
    </h1>


    <p>
        Local AI transcription using a background worker.
    </p>


    <!-- ==================================================
         DEVICE
    =================================================== -->


    <h2>
        1. Device
    </h2>


    <button id="device-test">
        Check My Device
    </button>


    <pre id="device-results">
Not checked yet.
    </pre>


    <!-- ==================================================
         MODEL
    =================================================== -->


    <h2>
        2. Quality
    </h2>


    <select id="model-select">

        <option
            value="onnx-community/whisper-tiny.en"
        >
            Fast - Whisper Tiny
        </option>


        <option
            value="onnx-community/whisper-base.en"
            selected
        >
            Balanced - Whisper Base
        </option>


        <option
            value="onnx-community/whisper-small.en"
        >
            High Quality - Whisper Small
        </option>

    </select>


    <p>
        Small gives better accuracy but may be extremely
        slow on weaker devices.
    </p>


    <!-- ==================================================
         AUDIO
    =================================================== -->


    <h2>
        3. Select Audio
    </h2>


    <input
        type="file"
        id="audio-file"
        accept="audio/*"
    >


    <p id="audio-info">
        No audio selected.
    </p>


    <!-- ==================================================
         TRANSCRIBE
    =================================================== -->


    <h2>
        4. Transcribe
    </h2>


    <button id="transcribe-button">
        Transcribe Audio
    </button>


    <p id="status">
        Waiting for audio...
    </p>


    <div id="progress-container">

        <div id="progress-bar"></div>

    </div>


    <p id="time-info"></p>


    <!-- ==================================================
         TRANSCRIPT
    =================================================== -->


    <h2>
        Transcript
    </h2>


    <textarea
        id="transcript"
        placeholder="Your transcript will appear here..."
    ></textarea>


    <!-- ==================================================
         DEBUG
    =================================================== -->


    <h2>
        Debug
    </h2>


    <pre id="debug"></pre>


    <!-- ==================================================
         DROPLET ENGINE
    =================================================== -->


    <script
        src="./voice-engine/js/device-check.js"
    ></script>


    <script
        src="./voice-engine/js/model-manager.js"
    ></script>


    <script
        src="./voice-engine/js/audio-processor.js"
    ></script>


    <script>


        // =================================================
        // ELEMENTS
        // =================================================


        const deviceButton =
            document.getElementById(
                "device-test"
            );


        const deviceResults =
            document.getElementById(
                "device-results"
            );


        const modelSelect =
            document.getElementById(
                "model-select"
            );


        const audioInput =
            document.getElementById(
                "audio-file"
            );


        const audioInfo =
            document.getElementById(
                "audio-info"
            );


        const transcribeButton =
            document.getElementById(
                "transcribe-button"
            );


        const status =
            document.getElementById(
                "status"
            );


        const progressBar =
            document.getElementById(
                "progress-bar"
            );


        const timeInfo =
            document.getElementById(
                "time-info"
            );


        const transcript =
            document.getElementById(
                "transcript"
            );


        const debug =
            document.getElementById(
                "debug"
            );


        // =================================================
        // STATE
        // =================================================


        let worker = null;

        let selectedFile = null;

        let preparedAudio = null;

        let jobCounter = 0;

        let activeJobId = null;

        let jobStartTime = null;

        let loadedModel = null;


        // =================================================
        // DEBUG LOGGER
        // =================================================


        function log(...values) {

            console.log(...values);


            const line =
                values
                    .map(value => {

                        if (
                            typeof value === "object"
                        ) {

                            try {

                                return JSON.stringify(
                                    value
                                );

                            } catch {

                                return String(value);
                            }
                        }


                        return String(value);

                    })
                    .join(" ");


            debug.textContent +=
                line + "\n";


            debug.scrollTop =
                debug.scrollHeight;
        }


        // =================================================
        // CREATE WORKER
        // =================================================


        function createWorker() {

            if (worker) {
                return worker;
            }


            log(
                "Creating Whisper worker..."
            );


            worker =
                new Worker(

                    "./voice-engine/workers/whisper-worker.js",

                    {
                        type: "module"
                    }
                );


            worker.onmessage =
                handleWorkerMessage;


            worker.onerror =
                function(error) {

                    console.error(
                        "Worker error:",
                        error
                    );


                    status.textContent =
                        "Worker error: " +
                        error.message;


                    transcribeButton.disabled =
                        false;
                };


            return worker;
        }


        // =================================================
        // WORKER MESSAGES
        // =================================================


        function handleWorkerMessage(event) {

            const message =
                event.data;


            log(
                "Worker:",
                message.type,
                message
            );


            // ---------------------------------------------
            // STATUS
            // ---------------------------------------------


            if (
                message.type === "status"
            ) {

                status.textContent =
                    message.message;

                return;
            }


            // ---------------------------------------------
            // MODEL DOWNLOAD
            // ---------------------------------------------


            if (
                message.type ===
                "model-progress"
            ) {

                const progress =
                    message.progress;


                if (
                    progress &&
                    typeof progress.progress ===
                    "number"
                ) {

                    const percent =
                        Math.round(
                            progress.progress
                        );


                    progressBar.style.width =
                        percent + "%";


                    status.textContent =
                        "Loading AI model: " +
                        percent +
                        "%";
                }


                return;
            }


            // ---------------------------------------------
            // MODEL READY
            // ---------------------------------------------


            if (
                message.type ===
                "model-ready"
            ) {

                loadedModel =
                    message.model;


                progressBar.style.width =
                    "0%";


                status.textContent =
                    "Whisper ready. Preparing transcription...";


                startWorkerTranscription();

                return;
            }


            // ---------------------------------------------
            // TRANSCRIPTION START
            // ---------------------------------------------


            if (
                message.type ===
                "transcription-start"
            ) {

                status.textContent =
                    "Transcribing in background...";


                jobStartTime =
                    performance.now();


                return;
            }


            // ---------------------------------------------
            // COMPLETE
            // ---------------------------------------------


            if (
                message.type ===
                "transcription-complete"
            ) {

                if (
                    message.jobId !==
                    activeJobId
                ) {

                    return;
                }


                transcript.value =
                    message.text ||
                    "No speech detected.";


                status.textContent =
                    "Transcription complete.";


                progressBar.style.width =
                    "100%";


                timeInfo.textContent =
                    "Audio: " +
                    message.duration.toFixed(1) +
                    " sec | Processing: " +
                    message.elapsed.toFixed(1) +
                    " sec";


                transcribeButton.disabled =
                    false;


                return;
            }


            // ---------------------------------------------
            // ERROR
            // ---------------------------------------------


            if (
                message.type === "error"
            ) {

                status.textContent =
                    "Transcription failed: " +
                    message.message;


                transcript.value =
                    "ERROR:\n\n" +
                    message.message;


                transcribeButton.disabled =
                    false;


                return;
            }
        }


        // =================================================
        // DEVICE TEST
        // =================================================


        deviceButton.addEventListener(

            "click",

            async function() {

                try {

                    const capabilities =
                        await window
                            .DropletVoice
                            .detectCapabilities();


                    deviceResults.textContent =
                        JSON.stringify(
                            capabilities,
                            null,
                            2
                        );

                } catch (error) {

                    deviceResults.textContent =
                        error.message;
                }
            }
        );


        // =================================================
        // AUDIO SELECTION
        // =================================================


        audioInput.addEventListener(

            "change",

            function() {

                selectedFile =
                    audioInput.files[0] ||
                    null;


                preparedAudio =
                    null;


                transcript.value =
                    "";


                progressBar.style.width =
                    "0%";


                if (!selectedFile) {

                    audioInfo.textContent =
                        "No audio selected.";

                    return;
                }


                audioInfo.textContent =
                    selectedFile.name +
                    " - " +
                    (
                        selectedFile.size /
                        1024 /
                        1024
                    ).toFixed(2) +
                    " MB";


                status.textContent =
                    "Audio selected. Ready.";
            }
        );


        // =================================================
        // TRANSCRIBE BUTTON
        // =================================================


        transcribeButton.addEventListener(

            "click",

            async function() {

                if (!selectedFile) {

                    alert(
                        "Please select an audio file first."
                    );

                    return;
                }


                transcribeButton.disabled =
                    true;


                transcript.value =
                    "";


                debug.textContent =
                    "";


                progressBar.style.width =
                    "0%";


                timeInfo.textContent =
                    "";


                try {

                    // -------------------------------------
                    // PREPARE AUDIO
                    // -------------------------------------


                    status.textContent =
                        "Decoding audio...";


                    log(
                        "Preparing:",
                        selectedFile.name
                    );


                    preparedAudio =
                        await window
                            .DropletVoice
                            .processAudioFile(
                                selectedFile
                            );


                    log(
                        "Prepared samples:",
                        preparedAudio.length
                    );


                    log(
                        "Duration:",
                        preparedAudio.length /
                        16000,
                        "seconds"
                    );


                    // -------------------------------------
                    // CREATE WORKER
                    // -------------------------------------


                    createWorker();


                    // -------------------------------------
                    // LOAD SELECTED MODEL
                    // -------------------------------------


                    const model =
                        modelSelect.value;


                    status.textContent =
                        "Loading Whisper model...";


                    worker.postMessage({

                        type:
                            "load-model",

                        model,

                        device:
                            "webgpu"
                    });


                } catch (error) {

                    console.error(error);


                    status.textContent =
                        "Failed: " +
                        error.message;


                    transcribeButton.disabled =
                        false;
                }

            }
        );


        // =================================================
        // SEND AUDIO TO WORKER
        // =================================================


        function startWorkerTranscription() {

            if (
                !worker ||
                !preparedAudio
            ) {

                status.textContent =
                    "Audio is not ready.";


                transcribeButton.disabled =
                    false;


                return;
            }


            jobCounter++;


            activeJobId =
                "job-" + jobCounter;


            /*
             * IMPORTANT:
             *
             * Make a transferable copy.
             *
             * Sending an ArrayBuffer as a transferable means
             * the browser can move ownership to the worker
             * instead of making another huge copy.
             */


            const transferable =
                preparedAudio.buffer;


            status.textContent =
                "Sending audio to background worker...";


            worker.postMessage(

                {
                    type:
                        "transcribe",

                    jobId:
                        activeJobId,

                    audioBuffer:
                        transferable
                },

                [
                    transferable
                ]
            );


            /*
             * The ArrayBuffer has now been transferred.
             * Do not use preparedAudio again.
             */


            preparedAudio =
                null;
        }


        // =================================================
        // CLEANUP
        // =================================================


        window.addEventListener(

            "beforeunload",

            function() {

                if (worker) {

                    worker.terminate();
                }
            }
        );


    </script>


</body>

</html>
