<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Droplet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center">
  <div class="max-w-md mx-auto text-center px-4">
    <div class="text-6xl mb-6">📡</div>
    <h1 class="text-2xl font-black text-slate-900 mb-2">You're Offline</h1>
    <p class="text-slate-500 text-sm mb-6">Please check your internet connection and try again.</p>
    <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl transition-all shadow-md shadow-blue-500/20">
      🔄 Retry
    </button>
    <div class="mt-6 text-xs text-slate-400">
      <p>💧 Droplet works offline for previously visited pages.</p>
    </div>
  </div>
</body>
</html>
